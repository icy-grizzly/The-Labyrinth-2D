<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Pixel Labyrinth MMORPG</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-color: #121812;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* --- HUD Overlay --- */
        #hud {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 0, 0, 0.65);
            padding: 8px 12px;
            border: 2px solid #333;
            border-radius: 4px;
        }
        .hud-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hud-label {
            font-size: 8px;
            color: #fff;
            text-shadow: 1px 1px #000;
            width: 50px;
        }
        .bar-container {
            width: 130px;
            height: 12px;
            background: #222;
            border: 2px solid #444;
            position: relative;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.1s linear;
        }
        #hp-fill { background: #e74c3c; }
        #exp-fill { background: #f1c40f; }
        #stress-fill { background: #a55eea; }

        #stats-hud {
            position: absolute;
            top: 120px;
            left: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 7px;
            color: #2ecc71;
            background: rgba(0, 0, 0, 0.65);
            padding: 6px 10px;
            border: 2px solid #333;
            pointer-events: none;
            z-index: 10;
        }

        /* --- Top Right Minimap & Info --- */
        #top-right-hud {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            z-index: 10;
            pointer-events: none;
        }
        #dungeon-info {
            font-size: 8px;
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 10px;
            border: 2px solid #444;
            color: #3498db;
            text-shadow: 1px 1px #000;
        }
        #minimap {
            width: 85px;
            height: 85px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #555;
        }

        /* --- Pause Button & Menu --- */
        #pause-btn {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            border: 2px solid #666;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 8px 12px;
            cursor: pointer;
            z-index: 20;
        }
        #pause-btn:active { background: #444; }

        #pause-menu {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            z-index: 30;
        }
        #pause-menu h1 {
            font-size: 16px;
            color: #f1c40f;
            text-shadow: 2px 2px #c0392b;
        }
        .menu-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            padding: 10px 20px;
            background: #2c3e50;
            border: 3px solid #3498db;
            color: white;
            cursor: pointer;
        }

        /* --- Mobile Controls --- */
        #joystick-zone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #joystick-handle {
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }
        #action-buttons {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        .btn-action {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            user-select: none;
        }
        #action-btn { background: rgba(231, 76, 60, 0.85); border: 3px solid #fff; }
        #magic-btn { background: rgba(142, 68, 173, 0.85); border: 3px solid #e056fd; display: none; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- Main HUD -->
    <div id="hud">
        <div class="hud-group">
            <span class="hud-label">HP</span>
            <div class="bar-container"><div id="hp-fill" class="bar-fill" style="width: 100%;"></div></div>
        </div>
        <div class="hud-group">
            <span class="hud-label">EXP</span>
            <div class="bar-container"><div id="exp-fill" class="bar-fill" style="width: 0%;"></div></div>
        </div>
        <div class="hud-group">
            <span class="hud-label">STRESS</span>
            <div class="bar-container"><div id="stress-fill" class="bar-fill" style="width: 0%;"></div></div>
        </div>
    </div>

    <!-- Stats HUD -->
    <div id="stats-hud">
        <div>LVL: <span id="stat-lvl">1</span></div>
        <div>ATK: <span id="stat-atk">10</span></div>
        <div>DEF: <span id="stat-def">0</span></div>
        <div>MAG: <span id="stat-mag">0</span></div>
        <div>WEAPON: <span id="stat-weapon" style="color: #f1c40f;">Rusty Blade</span></div>
    </div>

    <!-- Minimap HUD -->
    <div id="top-right-hud">
        <div id="dungeon-info">Labyrinth 1</div>
        <canvas id="minimap" width="85" height="85"></canvas>
    </div>

    <button id="pause-btn">PAUSE</button>

    <!-- Pause Menu -->
    <div id="pause-menu">
        <h1>GAME PAUSED</h1>
        <button class="menu-btn" id="resume-btn">RESUME</button>
        <button class="menu-btn" id="fullscreen-btn">FULLSCREEN</button>
    </div>

    <!-- Controls -->
    <div id="joystick-zone"><div id="joystick-handle"></div></div>
    <div id="action-buttons">
        <div class="btn-action" id="magic-btn">MAGIC</div>
        <div class="btn-action" id="action-btn">ATTACK</div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');

let isPaused = false;
let currentLevel = 1;

// Level 1 Initial Spawn Attributes
const player = {
    x: 100,
    y: 270,
    radius: 12,
    speed: 3.2,
    hp: 100,
    maxHp: 100,
    level: 1,
    exp: 0,
    maxExp: 100,
    atk: 10,
    def: 0,
    mag: 0,
    stress: 0,
    maxStress: 100,
    magicUnlocked: false,
    weapon: 'Rusty Blade',
    weaponEffect: null, // Freeze, Burn, Lifesteal
    attackRadius: 42,
    isAttacking: false,
    attackTimer: 0,
    facingAngle: 0,
    swingAngle: 0
};

const keys = {};
const mouse = { x: 480, y: 270 };
const monsters = [];
const walls = [];
const loots = [];
const projectiles = [];
const floatingTexts = [];
let portal = null;

// Joystick State
const joystick = { active: false, identifier: null, x: 0, y: 0 };

// Enemy Types by Labyrinth Level
const enemyTemplates = {
    1: { name: 'Acid Slime', color: '#2ecc71', radius: 10, hp: 35, speed: 1.1, exp: 30, dmgType: 'Acid', dmgColor: '#2ecc71' },
    2: { name: 'Fire Goblin', color: '#e67e22', radius: 13, hp: 65, speed: 1.4, exp: 50, dmgType: 'Fire', dmgColor: '#e67e22' },
    3: { name: 'Frost Skeleton', color: '#74b9ff', radius: 12, hp: 110, speed: 1.5, exp: 80, dmgType: 'Frost', dmgColor: '#0984e3' },
    4: { name: 'Void Boss', color: '#a55eea', radius: 22, hp: 400, speed: 0.9, exp: 350, dmgType: 'Void', dmgColor: '#a55eea', isBoss: true }
};

// --- Sound Effects Synthesizer ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'magic') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.25);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
    } else if (type === 'loot') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523, now);
        osc.frequency.setValueAtTime(659, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
    }
}

// --- Initialize Labyrinth Stages ---
function initLevel(lvl) {
    currentLevel = lvl;
    player.x = 80;
    player.y = 270;
    monsters.length = 0;
    loots.length = 0;
    projectiles.length = 0;
    portal = null;

    document.getElementById('dungeon-info').innerText = `Labyrinth ${lvl}`;

    // Outer Boundaries
    walls.length = 0;
    walls.push({ x: 0, y: 0, w: 960, h: 20 });
    walls.push({ x: 0, y: 520, w: 960, h: 20 });
    walls.push({ x: 0, y: 0, w: 20, h: 540 });
    walls.push({ x: 940, y: 0, w: 20, h: 540 });

    // Internal Labyrinth Layout
    if (lvl === 1) {
        walls.push({ x: 280, y: 80, w: 30, h: 260 });
        walls.push({ x: 580, y: 200, w: 30, h: 260 });
    } else if (lvl === 2) {
        walls.push({ x: 200, y: 100, w: 280, h: 30 });
        walls.push({ x: 520, y: 320, w: 280, h: 30 });
        walls.push({ x: 450, y: 130, w: 30, h: 190 });
    } else if (lvl === 3) {
        walls.push({ x: 200, y: 120, w: 35, h: 320 });
        walls.push({ x: 450, y: 60, w: 35, h: 320 });
        walls.push({ x: 700, y: 160, w: 35, h: 320 });
    } else {
        // Boss Room Arena Walls
        walls.push({ x: 300, y: 120, w: 40, h: 40 });
        walls.push({ x: 620, y: 120, w: 40, h: 40 });
        walls.push({ x: 300, y: 380, w: 40, h: 40 });
        walls.push({ x: 620, y: 380, w: 40, h: 40 });
    }

    // Spawn Enemies
    const key = Math.min(lvl, 4);
    const tmpl = enemyTemplates[key];
    const count = tmpl.isBoss ? 1 : (5 + lvl * 2);

    for (let i = 0; i < count; i++) {
        monsters.push({
            x: tmpl.isBoss ? 750 : (Math.random() * 550 + 300),
            y: tmpl.isBoss ? 270 : (Math.random() * 380 + 80),
            radius: tmpl.radius,
            hp: tmpl.hp,
            maxHp: tmpl.hp,
            speed: tmpl.speed,
            expReward: tmpl.exp,
            type: tmpl.name,
            color: tmpl.color,
            dmgType: tmpl.dmgType,
            dmgColor: tmpl.dmgColor,
            isBoss: tmpl.isBoss || false
        });
    }
}

// --- Dynamic Loot Drop System ---
function handleEnemyDrop(x, y) {
    if (Math.random() < 0.85) { // 85% drop rate
        const roll = Math.random();
        let type, color, label;

        if (roll < 0.35) {
            type = 'sword'; label = 'Undead Hero Sword'; color = '#bdc3c7';
        } else if (roll < 0.55) {
            type = 'staff'; label = 'Wizard Staff'; color = '#9b59b6';
        } else if (roll < 0.70) {
            type = 'book'; label = 'Magic Book'; color = '#3498db';
        } else if (roll < 0.85) {
            type = 'shield'; label = 'Shield'; color = '#e67e22';
        } else {
            type = 'potion'; label = 'HP Potion'; color = '#e74c3c';
        }

        loots.push({ x, y, type, label, color, radius: 8 });
    }
}

// --- Player Attack and Skill Triggering ---
function triggerAttack() {
    player.isAttacking = true;
    player.attackTimer = 10;
    player.swingAngle = player.facingAngle - 0.8;
    playSound('hit');

    monsters.forEach(m => {
        const dist = Math.hypot(m.x - player.x, m.y - player.y);
        if (dist < player.attackRadius + m.radius) {
            let baseDmg = player.atk + Math.floor(Math.random() * 8);
            if (player.weaponEffect === 'Burn') baseDmg += 6;
            m.hp -= baseDmg;

            addFloatingText(`-${baseDmg}`, m.x, m.y - 12, '#ffffff');

            if (player.weaponEffect === 'Lifesteal' && Math.random() < 0.4) {
                player.hp = Math.min(player.maxHp, player.hp + 4);
                addFloatingText('+4 HP', player.x, player.y - 15, '#2ecc71');
            }

            if (m.hp <= 0) {
                player.exp += m.expReward;
                handleEnemyDrop(m.x, m.y);
                checkLevelUp();
            }
        }
    });
}

function castMagic() {
    if (!player.magicUnlocked) return;
    playSound('magic');

    // Spawn 8 directional arcane projectiles
    for (let i = 0; i < 8; i++) {
        const angle = (Math.PI * 2 / 8) * i;
        projectiles.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(angle) * 6,
            vy: Math.sin(angle) * 6,
            damage: 25 + player.mag * 2,
            radius: 5,
            life: 60
        });
    }
}

function checkLevelUp() {
    if (player.exp >= player.maxExp) {
        player.level++;
        player.exp -= player.maxExp;
        player.maxExp = Math.floor(player.maxExp * 1.4);
        player.maxHp += 20;
        player.hp = player.maxHp;
        player.atk += 3;
        player.def += 1;
        addFloatingText('LEVEL UP!', player.x, player.y - 25, '#f1c40f');
    }
    updateHUD();
}

function addFloatingText(text, x, y, color) {
    floatingTexts.push({ text, x, y, color, opacity: 1, life: 35 });
}

// --- Collision Logic ---
function checkWallCollision(nx, ny, radius) {
    for (let w of walls) {
        if (nx + radius > w.x && nx - radius < w.x + w.w &&
            ny + radius > w.y && ny - radius < w.y + w.h) {
            return true;
        }
    }
    return false;
}

// --- Game Update Logic ---
function update() {
    if (isPaused) return;

    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;

    if (joystick.active) {
        dx += joystick.x;
        dy += joystick.y;
    }

    const mag = Math.hypot(dx, dy);
    if (mag > 1) { dx /= mag; dy /= mag; }

    if (dx !== 0 || dy !== 0) {
        player.facingAngle = Math.atan2(dy, dx);
    } else if (!joystick.active && window.innerWidth > 768) {
        player.facingAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    }

    let nextX = player.x + dx * player.speed;
    if (!checkWallCollision(nextX, player.y, player.radius)) player.x = nextX;

    let nextY = player.y + dy * player.speed;
    if (!checkWallCollision(player.x, nextY, player.radius)) player.y = nextY;

    if (player.isAttacking) {
        player.attackTimer--;
        player.swingAngle += 0.2;
        if (player.attackTimer <= 0) player.isAttacking = false;
    }

    // Process Projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        monsters.forEach(m => {
            if (Math.hypot(m.x - p.x, m.y - p.y) < m.radius + p.radius) {
                m.hp -= p.damage;
                addFloatingText(`-${p.damage}`, m.x, m.y - 10, '#e056fd');
                p.life = 0;
                if (m.hp <= 0) {
                    player.exp += m.expReward;
                    handleEnemyDrop(m.x, m.y);
                    checkLevelUp();
                }
            }
        });

        if (p.life <= 0 || checkWallCollision(p.x, p.y, p.radius)) {
            projectiles.splice(i, 1);
        }
    }

    // Process Monsters & Stress Gauge
    for (let i = monsters.length - 1; i >= 0; i--) {
        const m = monsters[i];
        if (m.hp <= 0) {
            monsters.splice(i, 1);
            if (monsters.length === 0 && !portal) {
                portal = { x: 880, y: 270, radius: 18 };
            }
            continue;
        }

        const dist = Math.hypot(player.x - m.x, player.y - m.y);

        // Stage Boss Stress Gauge Build-Up when near or failing to defeat boss quickly
        if (m.isBoss) {
            player.stress = Math.min(player.maxStress, player.stress + 0.08);
            if (player.stress >= player.maxStress && !player.magicUnlocked) {
                player.magicUnlocked = true;
                player.mag += 15;
                document.getElementById('magic-btn').style.display = 'flex';
                addFloatingText('MAGIC AWAKENED!', player.x, player.y - 30, '#a55eea');
            }
        }

        if (dist < 200 && dist > player.radius + m.radius) {
            m.x += ((player.x - m.x) / dist) * m.speed;
            m.y += ((player.y - m.y) / dist) * m.speed;
        }

        // Enemy Attack Player
        if (dist <= player.radius + m.radius) {
            const rawDmg = Math.max(1, (12 + currentLevel * 3) - player.def);
            player.hp = Math.max(0, player.hp - rawDmg);
            addFloatingText(`-${rawDmg} ${m.dmgType}`, player.x, player.y - 12, m.dmgColor);

            // Pushback
            player.x += ((player.x - m.x) / dist) * 10;
            player.y += ((player.y - m.y) / dist) * 10;

            if (player.hp <= 0) {
                alert('DEFEATED! Restarting Level...');
                player.hp = player.maxHp;
                initLevel(currentLevel);
            }
        }
    }

    // Process Item Pickups & Dynamic Attributes Update
    for (let i = loots.length - 1; i >= 0; i--) {
        const l = loots[i];
        if (Math.hypot(player.x - l.x, player.y - l.y) < player.radius + l.radius) {
            playSound('loot');
            if (l.type === 'sword') {
                player.atk += 8;
                player.weapon = 'Undead Hero Sword';
                player.weaponEffect = null;
            } else if (l.type === 'staff') {
                player.mag += 10;
                player.weapon = 'Wizard Staff';
                const effects = ['Freeze', 'Burn', 'Lifesteal'];
                player.weaponEffect = effects[Math.floor(Math.random() * effects.length)];
            } else if (l.type === 'book') {
                player.mag += 8;
                addFloatingText('+8 MAG', player.x, player.y - 15, '#3498db');
            } else if (l.type === 'shield') {
                player.def += 5;
                addFloatingText('+5 DEF', player.x, player.y - 15, '#e67e22');
            } else if (l.type === 'potion') {
                player.hp = Math.min(player.maxHp, player.hp + 40);
                addFloatingText('+40 HP', player.x, player.y - 15, '#e74c3c');
            }

            addFloatingText(`Got ${l.label}!`, player.x, player.y - 25, l.color);
            loots.splice(i, 1);
            updateHUD();
        }
    }

    // Check Portal Advance
    if (portal && Math.hypot(portal.x - player.x, portal.y - player.y) < player.radius + portal.radius) {
        initLevel(currentLevel + 1);
    }

    // Update Floating Text Life
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 0.6;
        ft.life--;
        ft.opacity = ft.life / 35;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }

    updateHUD();
}

// --- Render Loop ---
function draw() {
    ctx.fillStyle = '#121812';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Render Labyrinth Walls
    ctx.fillStyle = '#34495e';
    ctx.strokeStyle = '#1a252f';
    ctx.lineWidth = 3;
    walls.forEach(w => {
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeRect(w.x, w.y, w.w, w.h);
    });

    // Render Portal
    if (portal) {
        ctx.beginPath();
        ctx.arc(portal.x, portal.y, portal.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#9b59b6';
        ctx.fill();
        ctx.strokeStyle = '#e056fd';
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    // Render Loot Items
    loots.forEach(l => {
        ctx.beginPath();
        ctx.arc(l.x, l.y, l.radius, 0, Math.PI * 2);
        ctx.fillStyle = l.color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.stroke();
    });

    // Render Magic Projectiles
    projectiles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#e056fd';
        ctx.fill();
    });

    // Render Monsters
    monsters.forEach(m => {
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
        ctx.fillStyle = m.color;
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Monster HP Bar
        const bw = m.radius * 2;
        ctx.fillStyle = '#000';
        ctx.fillRect(m.x - bw/2, m.y - m.radius - 8, bw, 4);
        ctx.fillStyle = m.isBoss ? '#a55eea' : '#2ecc71';
        ctx.fillRect(m.x - bw/2, m.y - m.radius - 8, bw * (m.hp / m.maxHp), 4);
    });

    // Render Player
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#3498db';
    ctx.fill();
    ctx.strokeStyle = '#2980b9';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Render Equipped Weapon Visual
    if (player.isAttacking) {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.swingAngle);
        if (player.weapon === 'Wizard Staff') {
            ctx.fillStyle = '#9b59b6';
            ctx.fillRect(10, -3, 24, 6);
            ctx.fillStyle = '#e056fd';
            ctx.beginPath(); ctx.arc(32, 0, 6, 0, Math.PI * 2); ctx.fill();
        } else {
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(10, -4, 22, 8);
            ctx.fillStyle = '#d35400';
            ctx.fillRect(8, -6, 4, 12);
        }
        ctx.restore();
    } else {
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x + Math.cos(player.facingAngle) * 18, player.y + Math.sin(player.facingAngle) * 18);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // Render Floating Text
    floatingTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = ft.opacity;
        ctx.fillStyle = ft.color;
        ctx.font = '8px "Press Start 2P"';
        ctx.fillText(ft.text, ft.x - 12, ft.y);
        ctx.restore();
    });

    drawMiniMap();
}

function drawMiniMap() {
    mmCtx.fillStyle = 'rgba(0,0,0,0.9)';
    mmCtx.fillRect(0, 0, mmCanvas.width, mmCanvas.height);

    const sx = mmCanvas.width / 960;
    const sy = mmCanvas.height / 540;

    mmCtx.fillStyle = '#555';
    walls.forEach(w => mmCtx.fillRect(w.x * sx, w.y * sy, w.w * sx, w.h * sy));

    mmCtx.fillStyle = '#e74c3c';
    monsters.forEach(m => mmCtx.fillRect(m.x * sx - 1.5, m.y * sy - 1.5, 3, 3));

    mmCtx.fillStyle = '#3498db';
    mmCtx.fillRect(player.x * sx - 2, player.y * sy - 2, 4, 4);
}

function updateHUD() {
    document.getElementById('hp-fill').style.width = `${(player.hp / player.maxHp) * 100}%`;
    document.getElementById('exp-fill').style.width = `${(player.exp / player.maxExp) * 100}%`;
    document.getElementById('stress-fill').style.width = `${(player.stress / player.maxStress) * 100}%`;

    document.getElementById('stat-lvl').innerText = player.level;
    document.getElementById('stat-atk').innerText = player.atk;
    document.getElementById('stat-def').innerText = player.def;
    document.getElementById('stat-mag').innerText = player.mag;
    document.getElementById('stat-weapon').innerText = player.weapon + (player.weaponEffect ? ` (${player.weaponEffect})` : '');
}

// --- Mobile Touch Events ---
function setupMobileControls() {
    const zone = document.getElementById('joystick-zone');
    const handle = document.getElementById('joystick-handle');
    const attackBtn = document.getElementById('action-btn');
    const magicBtn = document.getElementById('magic-btn');

    zone.addEventListener('touchstart', e => {
        const t = e.changedTouches[0];
        joystick.active = true;
        joystick.identifier = t.identifier;
        updateJoystick(t.clientX, t.clientY);
    });

    window.addEventListener('touchmove', e => {
        if (!joystick.active) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === joystick.identifier) {
                updateJoystick(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
            }
        }
    });

    window.addEventListener('touchend', e => {
        if (!joystick.active) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === joystick.identifier) {
                joystick.active = false;
                joystick.x = 0; joystick.y = 0;
                handle.style.transform = `translate(0px, 0px)`;
            }
        }
    });

    function updateJoystick(cx, cy) {
        const rect = zone.getBoundingClientRect();
        const diffX = cx - (rect.left + rect.width / 2);
        const diffY = cy - (rect.top + rect.height / 2);
        const dist = Math.min(Math.hypot(diffX, diffY), 35);
        const angle = Math.atan2(diffY, diffX);

        const hx = Math.cos(angle) * dist;
        const hy = Math.sin(angle) * dist;
        handle.style.transform = `translate(${hx}px, ${hy}px)`;

        joystick.x = hx / 35;
        joystick.y = hy / 35;
    }

    attackBtn.addEventListener('touchstart', e => { e.preventDefault(); triggerAttack(); });
    magicBtn.addEventListener('touchstart', e => { e.preventDefault(); castMagic(); });
}

// --- Window & Keyboard Event Listeners ---
window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === ' ' && !player.isAttacking) triggerAttack();
    if (e.key.toLowerCase() === 'e') castMagic();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - rect.left) * (canvas.width / rect.width);
    mouse.y = (e.clientY - rect.top) * (canvas.height / rect.height);
});
canvas.addEventListener('mousedown', e => { if (e.button === 0) triggerAttack(); });

document.getElementById('pause-btn').addEventListener('click', () => {
    isPaused = !isPaused;
    document.getElementById('pause-menu').style.display = isPaused ? 'flex' : 'none';
});
document.getElementById('resume-btn').addEventListener('click', () => {
    isPaused = false;
    document.getElementById('pause-menu').style.display = 'none';
});
document.getElementById('fullscreen-btn').addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
});

// Main Loop
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

setupMobileControls();
initLevel(1);
gameLoop();
</script>
