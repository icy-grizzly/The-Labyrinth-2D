<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Pixel Labyrinth MMORPG</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-color: #1b261b;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* --- Streamlined HUD --- */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            z-index: 10;
        }
        .hud-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hud-label {
            font-size: 8px;
            color: #fff;
            text-shadow: 1px 1px #000;
            width: 32px;
        }
        .bar-container {
            width: 140px;
            height: 14px;
            background: #222;
            border: 2px solid #555;
            position: relative;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.1s linear;
        }
        #hp-fill { background: #e74c3c; }
        #exp-fill { background: #f1c40f; }

        /* --- Mini-Map & Dungeons --- */
        #top-right-hud {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            z-index: 10;
            pointer-events: none;
        }
        #dungeon-info {
            font-size: 8px;
            background: rgba(0,0,0,0.7);
            padding: 6px 10px;
            border: 2px solid #444;
            color: #3498db;
            text-shadow: 1px 1px #000;
        }
        #minimap {
            width: 90px;
            height: 90px;
            background: rgba(0,0,0,0.8);
            border: 2px solid #555;
            position: relative;
        }

        /* --- Pause Button & Menu --- */
        #pause-btn {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            border: 2px solid #777;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 8px 12px;
            cursor: pointer;
            z-index: 20;
        }
        #pause-btn:active { background: #555; }

        #pause-menu {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 30;
        }
        #pause-menu h1 {
            font-size: 16px;
            color: #f1c40f;
            text-shadow: 2px 2px #c0392b;
        }
        .menu-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 12px 24px;
            background: #2c3e50;
            border: 3px solid #3498db;
            color: white;
            cursor: pointer;
        }
        .menu-btn:active { background: #34495e; }

        /* --- Mobile Controls --- */
        #joystick-zone {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.05);
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #joystick-handle {
            position: absolute;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }
        #action-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            background: rgba(231, 76, 60, 0.8);
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #action-btn:active { background: rgba(192, 57, 43, 1); transform: scale(0.95); }

        /* Hide desktop hint on small touch screens */
        @media (max-width: 768px) {
            #controls-hint { display: none; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-group">
            <span class="hud-label">HP</span>
            <div class="bar-container"><div id="hp-fill" class="bar-fill" style="width: 100%;"></div></div>
        </div>
        <div class="hud-group">
            <span class="hud-label">EXP</span>
            <div class="bar-container"><div id="exp-fill" class="bar-fill" style="width: 0%;"></div></div>
        </div>
    </div>

    <div id="top-right-hud">
        <div id="dungeon-info">Labyrinth 1</div>
        <canvas id="minimap" width="90" height="90"></canvas>
    </div>

    <button id="pause-btn">PAUSE</button>

    <!-- Pause Menu -->
    <div id="pause-menu">
        <h1>GAME PAUSED</h1>
        <button class="menu-btn" id="resume-btn">RESUME</button>
        <button class="menu-btn" id="fullscreen-btn">FULLSCREEN</button>
    </div>

    <!-- Mobile Virtual Controls -->
    <div id="joystick-zone">
        <div id="joystick-handle"></div>
    </div>
    <div id="action-btn">ATTACK</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');

// Game States
let isPaused = false;
let currentLevel = 1;

const player = {
    x: 480,
    y: 270,
    radius: 12,
    speed: 3.2,
    hp: 100,
    maxHp: 100,
    exp: 0,
    maxExp: 100,
    attackRadius: 40,
    isAttacking: false,
    attackTimer: 0,
    facingAngle: 0,
    swingAngle: 0
};

const keys = {};
const mouse = { x: 480, y: 270 };
const monsters = [];
const walls = [];
let portal = null;

// Joystick state
const joystick = {
    active: false,
    identifier: null,
    startX: 0,
    startY: 0,
    x: 0,
    y: 0
};

// Enemy types per labyrinth level
const enemyTypes = {
    1: { name: 'Slime', color: '#2ecc71', radius: 10, hp: 30, speed: 1.1, exp: 30 },
    2: { name: 'Goblin', color: '#e67e22', radius: 13, hp: 60, speed: 1.5, exp: 50 },
    3: { name: 'Skeleton', color: '#ecf0f1', radius: 12, hp: 100, speed: 1.4, exp: 80 }
};

// --- Initialization & Labyrinth Generation ---
function initLevel(lvl) {
    currentLevel = lvl;
    player.x = 100;
    player.y = 270;
    monsters.length = 0;
    portal = null;

    document.getElementById('dungeon-info').innerText = `Labyrinth ${lvl}`;

    // Build Labyrinth Walls
    walls.length = 0;
    // Outer boundaries
    walls.push({ x: 0, y: 0, w: 960, h: 20 });
    walls.push({ x: 0, y: 520, w: 960, h: 20 });
    walls.push({ x: 0, y: 0, w: 20, h: 540 });
    walls.push({ x: 940, y: 0, w: 20, h: 540 });

    // Internal labyrinth layout based on level
    if (lvl === 1) {
        walls.push({ x: 300, y: 100, w: 40, h: 250 });
        walls.push({ x: 600, y: 200, w: 40, h: 250 });
    } else if (lvl === 2) {
        walls.push({ x: 200, y: 100, w: 250, h: 30 });
        walls.push({ x: 500, y: 300, w: 250, h: 30 });
        walls.push({ x: 450, y: 130, w: 30, h: 170 });
    } else {
        walls.push({ x: 200, y: 120, w: 40, h: 300 });
        walls.push({ x: 450, y: 80, w: 40, h: 300 });
        walls.push({ x: 700, y: 150, w: 40, h: 300 });
    }

    // Spawn 5-8 enemies appropriate for this labyrinth tier
    const typeKey = Math.min(lvl, 3);
    const template = enemyTypes[typeKey];
    const count = 5 + lvl * 2;

    for (let i = 0; i < count; i++) {
        monsters.push({
            x: Math.random() * 600 + 250,
            y: Math.random() * 400 + 70,
            radius: template.radius,
            hp: template.hp,
            maxHp: template.hp,
            speed: template.speed,
            expReward: template.exp,
            type: template.name,
            color: template.color
        });
    }
}

// --- Event Listeners ---
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - rect.left) * (canvas.width / rect.width);
    mouse.y = (e.clientY - rect.top) * (canvas.height / rect.height);
});

canvas.addEventListener('mousedown', e => {
    if (e.button === 0 && !player.isAttacking && !isPaused) {
        triggerAttack();
    }
});

// Pause & Menu bindings
document.getElementById('pause-btn').addEventListener('click', togglePause);
document.getElementById('resume-btn').addEventListener('click', togglePause);
document.getElementById('fullscreen-btn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
    }
});

function togglePause() {
    isPaused = !isPaused;
    document.getElementById('pause-menu').style.display = isPaused ? 'flex' : 'none';
}

// Mobile touch handlers
function setupMobileControls() {
    const zone = document.getElementById('joystick-zone');
    const attackBtn = document.getElementById('action-btn');

    zone.addEventListener('touchstart', e => {
        if (!joystick.active) {
            const touch = e.changedTouches[0];
            joystick.active = true;
            joystick.identifier = touch.identifier;
            updateJoystick(touch.clientX, touch.clientY);
        }
    });

    window.addEventListener('touchmove', e => {
        if (!joystick.active) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === joystick.identifier) {
                updateJoystick(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
            }
        }
    });

    window.addEventListener('touchend', e => {
        if (!joystick.active) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === joystick.identifier) {
                resetJoystick();
            }
        }
    });

    attackBtn.addEventListener('touchstart', e => {
        e.preventDefault();
        if (!player.isAttacking && !isPaused) triggerAttack();
    });
}

function updateJoystick(clientX, clientY) {
    const zone = document.getElementById('joystick-zone');
    const rect = zone.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const diffX = clientX - centerX;
    const diffY = clientY - centerY;
    const dist = Math.hypot(diffX, diffY);
    const maxDist = 40;

    let angle = Math.atan2(diffY, diffX);
    let clampedDist = Math.min(dist, maxDist);

    const handleX = Math.cos(angle) * clampedDist;
    const handleY = Math.sin(angle) * clampedDist;

    document.getElementById('joystick-handle').style.transform = `translate(${handleX}px, ${handleY}px)`;
    joystick.x = handleX / maxDist;
    joystick.y = handleY / maxDist;
}

function resetJoystick() {
    joystick.active = false;
    joystick.identifier = null;
    joystick.x = 0;
    joystick.y = 0;
    document.getElementById('joystick-handle').style.transform = `translate(0px, 0px)`;
}

function triggerAttack() {
    player.isAttacking = true;
    player.attackTimer = 12;
    player.swingAngle = player.facingAngle - 0.7;
    performAttack();
}

// --- Combat & Mechanics ---
function performAttack() {
    monsters.forEach(m => {
        const dist = Math.hypot(m.x - player.x, m.y - player.y);
        if (dist < player.attackRadius + m.radius) {
            const dmg = Math.floor(Math.random() * 15) + 20;
            m.hp -= dmg;
            if (m.hp <= 0) {
                player.exp += m.expReward;
                checkLevelUp();
            }
        }
    });

    // Check portal interaction if cleared
    if (portal && Math.hypot(portal.x - player.x, portal.y - player.y) < player.radius + portal.radius) {
        initLevel(currentLevel + 1);
    }
}

function checkLevelUp() {
    if (player.exp >= player.maxExp) {
        player.exp -= player.maxExp;
        player.maxExp = Math.floor(player.maxExp * 1.4);
        player.maxHp += 25;
        player.hp = player.maxHp;
    }
    updateHUD();
}

// Collision detection with walls
function checkCollision(nx, ny, radius) {
    for (let w of walls) {
        if (nx + radius > w.x && nx - radius < w.x + w.w &&
            ny + radius > w.y && ny - radius < w.y + w.h) {
            return true;
        }
    }
    return false;
}

// --- Update Loop ---
function update() {
    if (isPaused) return;

    let dx = 0;
    let dy = 0;

    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;

    if (joystick.active) {
        dx += joystick.x;
        dy += joystick.y;
    }

    const mag = Math.hypot(dx, dy);
    if (mag > 1) { dx /= mag; dy /= mag; }

    if (dx !== 0 || dy !== 0) {
        player.facingAngle = Math.atan2(dy, dx);
    } else if (!joystick.active && window.innerWidth > 768) {
        player.facingAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    }

    // Move with wall collision checks
    let nextX = player.x + dx * player.speed;
    if (!checkCollision(nextX, player.y, player.radius)) player.x = nextX;

    let nextY = player.y + dy * player.speed;
    if (!checkCollision(player.x, nextY, player.radius)) player.y = nextY;

    if (player.isAttacking) {
        player.attackTimer--;
        player.swingAngle += 0.15;
        if (player.attackTimer <= 0) player.isAttacking = false;
    }

    // Update Monsters
    for (let i = monsters.length - 1; i >= 0; i--) {
        const m = monsters[i];
        if (m.hp <= 0) {
            monsters.splice(i, 1);
            if (monsters.length === 0 && !portal) {
                // Spawn Portal to next labyrinth
                portal = { x: 880, y: 270, radius: 18 };
            }
            continue;
        }

        const distToPlayer = Math.hypot(player.x - m.x, player.y - m.y);
        if (distToPlayer < 220 && distToPlayer > player.radius + m.radius) {
            let mx = ((player.x - m.x) / distToPlayer) * m.speed;
            let my = ((player.y - m.y) / distToPlayer) * m.speed;
            m.x += mx;
            m.y += my;
        }
    }
}

// --- Render Loop ---
function draw() {
    ctx.fillStyle = '#1b261b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Labyrinth Walls
    ctx.fillStyle = '#3e4a3d';
    ctx.strokeStyle = '#2b362a';
    ctx.lineWidth = 3;
    walls.forEach(w => {
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeRect(w.x, w.y, w.w, w.h);
    });

    // Draw Portal if active
    if (portal) {
        ctx.beginPath();
        ctx.arc(portal.x, portal.y, portal.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#9b59b6';
        ctx.fill();
        ctx.strokeStyle = '#e056fd';
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    // Draw Monsters
    monsters.forEach(m => {
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
        ctx.fillStyle = m.color;
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();

        // HP bar
        const bw = 20;
        ctx.fillStyle = '#000';
        ctx.fillRect(m.x - bw/2, m.y - m.radius - 8, bw, 4);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(m.x - bw/2, m.y - m.radius - 8, bw * (m.hp / m.maxHp), 4);
    });

    // Draw Player
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#3498db';
    ctx.fill();
    ctx.strokeStyle = '#2980b9';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Draw Weapon Visual (Retro Sword Swing)
    if (player.isAttacking) {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.swingAngle);
        ctx.fillStyle = '#bdc3c7';
        ctx.fillRect(10, -4, 20, 8); // Sword blade
        ctx.fillStyle = '#d35400';
        ctx.fillRect(8, -6, 4, 12);  // Hilt
        ctx.restore();
    } else {
        // Direction pointer
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x + Math.cos(player.facingAngle) * 18, player.y + Math.sin(player.facingAngle) * 18);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    drawMiniMap();
}

function drawMiniMap() {
    mmCtx.fillStyle = 'rgba(0,0,0,0.9)';
    mmCtx.fillRect(0, 0, mmCanvas.width, mmCanvas.height);

    const scaleX = mmCanvas.width / 960;
    const scaleY = mmCanvas.height / 540;

    // Walls on minimap
    mmCtx.fillStyle = '#555';
    walls.forEach(w => {
        mmCtx.fillRect(w.x * scaleX, w.y * scaleY, w.w * scaleX, w.h * scaleY);
    });

    // Portal on minimap
    if (portal) {
        mmCtx.fillStyle = '#9b59b6';
        mmCtx.fillRect(portal.x * scaleX - 2, portal.y * scaleY - 2, 4, 4);
    }

    // Monsters on minimap
    mmCtx.fillStyle = '#e74c3c';
    monsters.forEach(m => {
        mmCtx.fillRect(m.x * scaleX - 1.5, m.y * scaleY - 1.5, 3, 3);
    });

    // Player on minimap
    mmCtx.fillStyle = '#3498db';
    mmCtx.fillRect(player.x * scaleX - 2, player.y * scaleY - 2, 4, 4);
}

function updateHUD() {
    document.getElementById('hp-fill').style.width = `${(player.hp / player.maxHp) * 100}%`;
    document.getElementById('exp-fill').style.width = `${(player.exp / player.maxExp) * 100}%`;
}

// --- Game Loop ---
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

setupMobileControls();
initLevel(1);
gameLoop();
</script>
</body>
</html>
